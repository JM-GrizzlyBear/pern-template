name: Clear database

# Deletes EVERY row in EVERY table of the database in the DATABASE_URL secret
# (users, sessions, notes and any table you add later). The tables themselves stay.
# Use it to wipe test data, for example before sharing a live app.
# GitHub → Actions → "Clear database" → Run workflow → type CLEAR → Run workflow
# Needs the repository secret DATABASE_URL (README → "Clearing a database").

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "This deletes ALL data. Type CLEAR to continue."
        required: true
        type: string

jobs:
  clear:
    name: Delete all rows
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'CLEAR' }}
        env:
          TYPED: ${{ inputs.confirm }}
        run: |
          echo "Nothing was deleted: you typed '$TYPED', not CLEAR."
          exit 1

      - name: Check the secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "The DATABASE_URL secret is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Only table names and counts are printed, never data:
      # Actions logs can be seen by anyone who can see the repo
      - name: Delete every row
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          \echo 'Tables emptied (dbmate''s schema_migrations is kept):'
          select string_agg(tablename, ', ' order by tablename) as tables
          from pg_tables
          where schemaname = 'public' and tablename <> 'schema_migrations';

          do $$
          declare tables text;
          begin
            select string_agg(format('%I.%I', schemaname, tablename), ', ')
              into tables
              from pg_tables
              where schemaname = 'public' and tablename <> 'schema_migrations';
            if tables is not null then
              execute 'truncate table ' || tables || ' restart identity cascade';
            end if;
          end $$;

          \echo 'Done: every table is empty.'
          SQL
