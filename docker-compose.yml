# Two ways to use this file (values come from the root .env):
#
#   docker compose up -d db       only Postgres, for "turbo run dev" (the usual way while coding)
#   docker compose up --build     everything: Postgres + the production app on http://localhost:8080
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The production image (Dockerfile): runs the migrations, then serves the API and the website
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      # http://localhost has no HTTPS, so the login cookie can't be HTTPS-only here
      COOKIE_SECURE: "false"
    ports:
      - "8080:4000"

volumes:
  pgdata:
