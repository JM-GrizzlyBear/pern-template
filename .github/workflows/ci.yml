name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check, lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo isn't installed globally on GitHub's machines, so it runs through pnpm exec
      - run: pnpm exec turbo run check-types lint build

      # Fails when a file isn't formatted (for example after an edit on github.com).
      # Fix it on your computer with: pnpm exec prettier --write .
      - run: pnpm exec prettier --check .

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t pern-template .

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # A throwaway Postgres just for the tests (emptied before every test)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit tests, then integration tests against the test database
      - run: pnpm exec turbo run test
